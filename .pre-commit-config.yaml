# NOTE: This file should be named prek.toml but Renovate does not support it yet.
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: check-json
      - id: check-json5
      - id: check-toml
      - id: check-yaml
        args:
          - --allow-multiple-documents
      - id: check-xml
      - id: mixed-line-ending
      - id: check-symlinks
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-executables-have-shebangs

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-ast
      - id: check-shebang-scripts-are-executable
        exclude: ^nep/setup/(?:templates/|library/setup_scripts/)
      - id: requirements-txt-fixer

  - repo: meta
    hooks:
      - id: check-useless-excludes

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # frozen: v2.4.3
    hooks:
      - id: codespell # Ignore attribute names in Dashboard JSON files
        name: codespell-itoa-dashboards
        files: ^nep/[^/]+/itoa/[^/]+/.*\.json$
        args:
          - --ignore-words-list=showIn

      - id: codespell # Skip files that do not directly belong to NEP Project
        exclude: |
          (?x)^(
            nep/[^/]+/itoa/[^/]+/.*\.json
            |nep/[^/]+/custom_files/system_root/usr/share/snmp/mibs/.+
            |nep/nep-common/plugins/check_mem\.pl
            |nep/nep-common/plugins/check_netstat\.pl
            |nep/nep-database-mssql/plugins/check_mssql_health
            |nep/nep-database-oracle/plugins/check_oracle_health
            |nep/nep-monitoring-asset/plugins/check_systemd_timer
            |nep/nep-monitoring-core/plugins/check_linux_timesync_status.py
            |nep/nep-monitoring-core/plugins/check_modem_smst.pl
            |nep/nep-monitoring-core/plugins/check_mysql_health
            |nep/nep-monitoring-siem/plugins/check_es_system\.sh
            |nep/nep-network-base/plugins/check_nwc_health
            |nep/nep-network-messpc-ethernetbox/plugins/check_pcmeasure2\.pl
            |nep/nep-network-printer/plugins/check_printer_health
            |nep/nep-network-ups/plugins/check_ups_health
            |nep/nep-server-email/plugins/check_smtp_send
            |nep/nep-server-sap/plugins/check_sap_health
            |nep/nep-vmware-api/plugins/check_vmware_api
            |nep/nep-vmware-api/plugins/check_vmware_snapshots\.pl
            |nep/nep-windows-server-exchange/plugins/Exchange_FullBackupMonitoring\.ps1
            |nep/nep-windows-server-exchange/plugins/Exchange_IncrementalBackupMonitoring\.ps1
          )$

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=error]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1 # frozen: v0.17.5
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: b9d5257d60a86c20fd9a3919d548e08ba5ab905b # frozen: 0.13.8
    hooks:
      - id: uv-lock

  - repo: https://github.com/ansible/ansible-lint
    rev: b74fb6f73d234bf92672372cb1c10768e4018d16 # frozen: v26.11.0
    hooks:
      - id: ansible-lint

  - repo: https://github.com/hadolint/hadolint
    rev: 2eece55955ced00200be9729e9728cb7dacca505 # frozen: v2.15.1
    hooks:
      - id: hadolint-docker

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: c01a1853c19b175aee6a09f24e2ad9b748c485ad # frozen: v0.24.1
    hooks:
      - id: markdownlint-cli2
        exclude: |
          (?x)^(
            LICENSE\.md
            |CHANGELOG\.md
          )$

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: bf252c92d5fccab3ce0b7e1f7ad1ca8615338465 # frozen: 43.288.0
    hooks:
      - id: renovate-config-validator
        args: [--strict]
